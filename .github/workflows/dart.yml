name: Build and Deploy Flutter Web

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Sets permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Configure GitHub Pages base path so web assets load properly
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # Build web app with base-href matching your GitHub repository name
      - name: Build Web Release
        run: flutter build web --release --base-href "${{ steps.pages.outputs.base_path }}/"

      # Prepare artifacts for GitHub Pages deployment
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/

      # Deploy the built release to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4